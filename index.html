<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 模式切换标签 -->
        <div class="mode-tabs">
            <button class="mode-btn active" data-mode="pomodoro">专注</button>
            <button class="mode-btn" data-mode="shortBreak">短休息</button>
            <button class="mode-btn" data-mode="longBreak">长休息</button>
        </div>

        <!-- 计时器显示 -->
        <div class="timer-container">
            <div class="progress-ring">
                <svg class="progress-svg" viewBox="0 0 120 120">
                    <circle class="progress-bg" cx="60" cy="60" r="54"></circle>
                    <circle class="progress-bar" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="timer-display">
                    <span class="time">25:00</span>
                    <span class="status">准备专注</span>
                </div>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn secondary" id="resetBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
            <button class="control-btn primary" id="startBtn">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button class="control-btn secondary" id="settingsBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L5.08 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.04.64.09.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.58 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>

        <!-- 今日统计 -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-value" id="completedCount">0</span>
                <span class="stat-label">已完成</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="totalFocusTime">0</span>
                <span class="stat-label">专注分钟</span>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label>专注时长（分钟）</label>
                    <input type="number" id="pomodoroTime" value="25" min="1" max="60">
                </div>
                <div class="setting-item">
                    <label>短休息时长（分钟）</label>
                    <input type="number" id="shortBreakTime" value="5" min="1" max="30">
                </div>
                <div class="setting-item">
                    <label>长休息时长（分钟）</label>
                    <input type="number" id="longBreakTime" value="15" min="1" max="60">
                </div>
                <div class="setting-item">
                    <label>自动开始休息</label>
                    <label class="switch">
                        <input type="checkbox" id="autoStartBreak">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label>音效</label>
                    <label class="switch">
                        <input type="checkbox" id="soundEnabled" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="settings-footer">
                <button class="save-btn" id="saveSettings">保存</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
